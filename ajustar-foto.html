<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ajustar foto da Minnie</title>
<style>
  :root{ --rosa:#e8859b; --rosa-escuro:#d1577a; --rosa-claro:#fce8ee; --creme:#fff8f4; --texto:#4a3b42; --sombra:0 6px 20px rgba(209,87,122,.12); --radius:16px; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Segoe UI",system-ui,sans-serif; color:var(--texto); background:var(--creme); line-height:1.5; padding:1.5rem 1rem 3rem; }
  .wrap{ max-width:760px; margin:0 auto; }
  h1{ color:var(--rosa-escuro); font-size:1.5rem; text-align:center; }
  p.sub{ text-align:center; color:#8a7b82; margin-top:-.4rem; }
  .painel{ display:grid; grid-template-columns:1fr; gap:1.4rem; align-items:start; }
  @media(min-width:680px){ .painel{ grid-template-columns:auto 1fr; } }

  /* Moldura EXATAMENTE como o site */
  .foto-wrap{
    position:relative; width:100%; max-width:360px; margin:0 auto;
    aspect-ratio:4/3; overflow:hidden; border-radius:var(--radius);
    box-shadow:var(--sombra); background:#fff; cursor:grab; touch-action:none;
    outline:2px dashed var(--rosa); outline-offset:4px;
  }
  .foto-wrap.arrastando{ cursor:grabbing; }
  .foto-wrap img{
    position:absolute; top:50%; left:50%; width:100%; height:auto;
    transform:translate(calc(-50% + var(--px)), calc(-50% + var(--py))) scale(var(--z));
    transform-origin:center center; user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  figcaption{ text-align:center; color:#8a7b82; font-size:.85rem; margin-top:.6rem; }

  .controles{ background:#fff; border:1px solid #ecddd7; border-radius:var(--radius); padding:1.2rem; box-shadow:var(--sombra); }
  label{ display:block; font-weight:600; font-size:.9rem; margin:.9rem 0 .3rem; }
  input[type=range]{ width:100%; accent-color:var(--rosa-escuro); }
  .formatos{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .formatos button{ flex:1; min-width:70px; border:1.5px solid var(--rosa); background:#fff; color:var(--rosa-escuro); border-radius:999px; padding:.4rem .6rem; font:inherit; font-weight:600; cursor:pointer; }
  .formatos button.ativo{ background:var(--rosa-escuro); color:#fff; }
  .acoes{ display:flex; gap:.6rem; margin-top:1rem; }
  .acoes button{ flex:1; border:none; border-radius:999px; padding:.7rem; font:inherit; font-weight:700; cursor:pointer; }
  .btn-reset{ background:#fff; border:1.5px solid #ecddd7 !important; color:var(--texto); }
  .btn-copiar{ background:var(--rosa-escuro); color:#fff; }
  .valores{ margin-top:1.1rem; background:var(--rosa-claro); border-radius:12px; padding:.9rem 1rem; font-size:.95rem; }
  .valores b{ color:var(--rosa-escuro); }
  .valores code{ display:block; margin-top:.5rem; background:#fff; border-radius:8px; padding:.6rem; font-size:.95rem; word-break:break-all; }
  .copiado{ color:var(--rosa-escuro); font-weight:700; font-size:.85rem; text-align:center; margin-top:.5rem; height:1em; }
  .dica{ font-size:.82rem; color:#8a7b82; margin-top:1rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ajustar foto da Minnie</h1>
  <p class="sub">Arraste a foto, dê zoom e escolha o formato. O quadro mostra exatamente como vai ficar no site.</p>

  <div class="painel">
    <figure style="margin:0">
      <div class="foto-wrap" id="frame">
        <img id="img" src="public/img/minnie.jpg" alt="Minnie" />
      </div>
      <figcaption>A Minnie agradece o seu carinho</figcaption>
    </figure>

    <div class="controles">
      <label>Formato do quadro</label>
      <div class="formatos" id="formatos">
        <button data-ar="4/3">4:3</button>
        <button data-ar="1/1">Quadrado</button>
        <button data-ar="3/4">Retrato</button>
        <button data-ar="16/9">Largo</button>
      </div>

      <label>Zoom (<span id="zoomTxt">100%</span>)</label>
      <input type="range" id="zoom" min="100" max="300" value="100" />

      <label>Posição horizontal</label>
      <input type="range" id="posx" min="-50" max="50" value="0" />

      <label>Posição vertical</label>
      <input type="range" id="posy" min="-50" max="50" value="0" />

      <div class="acoes">
        <button class="btn-reset" id="reset">Recomeçar</button>
        <button class="btn-copiar" id="copiar">Copiar valores</button>
      </div>
      <div class="copiado" id="copiado"></div>

      <div class="valores">
        Me mande estes <b>valores</b> que eu aplico no site:
        <code id="resumo"></code>
      </div>

      <p class="dica">Dica: você pode arrastar a foto direto no quadro com o mouse (ou o dedo no celular) e usar a rolagem para dar zoom.</p>
    </div>
  </div>
</div>

<script>
  const frame = document.getElementById('frame');
  const img   = document.getElementById('img');
  const zoom  = document.getElementById('zoom');
  const posx  = document.getElementById('posx');
  const posy  = document.getElementById('posy');
  const zoomTxt = document.getElementById('zoomTxt');
  const resumo  = document.getElementById('resumo');
  let ar = '4/3';

  function aplicar(){
    const z  = (+zoom.value)/100;
    const px = (+posx.value);
    const py = (+posy.value);
    frame.style.aspectRatio = ar.replace('/', ' / ');
    img.style.setProperty('--z', z);
    img.style.setProperty('--px', px + '%');
    img.style.setProperty('--py', py + '%');
    zoomTxt.textContent = zoom.value + '%';
    resumo.textContent = `formato ${ar}  |  zoom ${z.toFixed(2)}  |  x ${px}%  |  y ${py}%`;
  }

  [zoom, posx, posy].forEach(el => el.addEventListener('input', aplicar));

  document.getElementById('formatos').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    ar = b.dataset.ar;
    document.querySelectorAll('#formatos button').forEach(x => x.classList.toggle('ativo', x===b));
    aplicar();
  });

  document.getElementById('reset').addEventListener('click', () => {
    zoom.value=100; posx.value=0; posy.value=0; aplicar();
  });

  document.getElementById('copiar').addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(resumo.textContent);
      document.getElementById('copiado').textContent = 'Copiado! Cole aqui no chat.'; }
    catch{ document.getElementById('copiado').textContent = 'Anote os valores acima.'; }
    setTimeout(()=>document.getElementById('copiado').textContent='', 3000);
  });

  // Arrastar com mouse/dedo
  let drag=null;
  frame.addEventListener('pointerdown', e => {
    drag={ x:e.clientX, y:e.clientY, px:+posx.value, py:+posy.value };
    frame.classList.add('arrastando'); frame.setPointerCapture(e.pointerId);
  });
  frame.addEventListener('pointermove', e => {
    if(!drag) return;
    const r = frame.getBoundingClientRect();
    posx.value = Math.max(-50, Math.min(50, drag.px + (e.clientX-drag.x)/r.width*100));
    posy.value = Math.max(-50, Math.min(50, drag.py + (e.clientY-drag.y)/r.height*100));
    aplicar();
  });
  frame.addEventListener('pointerup',   ()=>{ drag=null; frame.classList.remove('arrastando'); });
  frame.addEventListener('pointercancel',()=>{ drag=null; frame.classList.remove('arrastando'); });

  // Zoom com rolagem
  frame.addEventListener('wheel', e => {
    e.preventDefault();
    zoom.value = Math.max(100, Math.min(300, +zoom.value - Math.sign(e.deltaY)*5));
    aplicar();
  }, { passive:false });

  // Formato inicial
  document.querySelector('#formatos button[data-ar="4/3"]').classList.add('ativo');
  img.addEventListener('load', aplicar);
  aplicar();
</script>
</body>
</html>
